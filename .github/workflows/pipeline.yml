name: pipeline

# Keeps the demo corpus fresh: fetches new HN "Who is hiring?" postings, parses
# and embeds them, marks duplicates. Scoring happens per visitor in the web app,
# so it is not part of this run.
#
# Requires repo secrets: DEMO_DATABASE_URL, GEMINI_API_KEY

on:
  schedule:
    # Every 6 hours (UTC). GitHub cron is best-effort and may run late.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "Max HN comments to fetch this run"
        required: false
        default: "30"

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Apply schema (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          EMBEDDING_PROVIDER: gemini
        run: uv run python scripts/apply_schema.py

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          EMBEDDING_PROVIDER: gemini
          RUN_SCHEDULER: "false"
        run: uv run python scripts/run_pipeline.py --fetch-limit ${{ github.event.inputs.fetch_limit || '30' }}
