[project]
name = "applytrak"
version = "0.1.0"
description = "Scheduled background service that surfaces relevant new job postings daily, parsed and ranked against my resume, delivered via Telegram."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sanket" }]

dependencies = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applytrak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
