[project]
name = "applytrak"
version = "0.1.0"
description = "Scheduled background service that surfaces relevant new job postings daily, parsed and ranked against my resume, delivered via Telegram."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sanket" }]

# Core: everything the deployed demo needs (Gemini provider + web app + pipeline).
# Deliberately excludes the Anthropic and Voyage providers — the deployment
# installs with `uv sync --no-dev`, and those pull ~45 MB of transitive weight
# (pillow, tokenizers, hf-xet, aiohttp) against a 250 MB function ceiling. Their
# imports are all lazy, so the app runs fine without them installed.
dependencies = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "google-genai>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pgvector>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
# Alternative providers, used for local runs and the eval suite.
providers = [
    "anthropic>=0.40",
    "langsmith>=0.2",
    "voyageai>=0.3",
]

[dependency-groups]
# Installed by default with a plain `uv sync`, so local dev, Docker, and CI all
# get the alternative providers; only `--no-dev` (i.e. the deployment) omits them.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "applytrak[providers]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applytrak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
